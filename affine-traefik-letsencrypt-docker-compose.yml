# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}}
  postgres: &postgres-image ${AFFINE_POSTGRES_IMAGE_TAG:-postgres:${AFFINE_POSTGRES_IMAGE_VERSION:-16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}}
  redis: &redis-image ${AFFINE_REDIS_IMAGE_TAG:-redis:${AFFINE_REDIS_IMAGE_VERSION:-7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}}
  affine: &affine-image ${AFFINE_IMAGE_TAG:-ghcr.io/toeverything/affine:${AFFINE_IMAGE_VERSION:-stable@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099}}

networks:
  affine-network:
    external: true
  traefik-network:
    external: true

volumes:
  affine-data:
  affine-config:
  redis-data:
  affine-postgres:
  affine-postgres-backup:
  affine-data-backups:
  affine-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. AFFINE_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${AFFINE_POSTGRES_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${AFFINE_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${AFFINE_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${AFFINE_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${AFFINE_POSTGRES_CPU_RESERVATION:-0.25}"
    container_name: affine_postgres
    volumes:
      - affine-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AFFINE_DB_NAME:-affinedb}
      POSTGRES_USER: ${AFFINE_DB_USER:-affinedbuser}
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - affine-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${AFFINE_DB_NAME:-affinedb}", "-U", "${AFFINE_DB_USER:-affinedbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. AFFINE_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${AFFINE_REDIS_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${AFFINE_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${AFFINE_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${AFFINE_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${AFFINE_REDIS_CPU_RESERVATION:-0.1}"
    container_name: affine_redis
    command: ["redis-server", "--requirepass", "$AFFINE_REDIS_PASSWORD"]
    volumes:
      - redis-data:/data
    networks:
      - affine-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$AFFINE_REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  affine_migration:
    image: *affine-image
    container_name: affine_migration_job
    volumes:
      - affine-data:/root/.affine/storage
      - affine-config:/root/.affine/config
    environment:
      NODE_ENV: production
      AFFINE_CONFIG_PATH: /root/.affine/config
      DATABASE_URL: postgres://${AFFINE_DB_USER:-affinedbuser}:${AFFINE_DB_PASSWORD}@postgres:5432/${AFFINE_DB_NAME:-affinedb}
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: 6379
      REDIS_SERVER_PASSWORD: ${AFFINE_REDIS_PASSWORD:?set in .env - see .env.example for generation command}
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_URL:?set in .env - see .env.example}
      AFFINE_SERVER_HOST: ${AFFINE_HOSTNAME:?set in .env - see .env.example}
      AFFINE_SERVER_HTTPS: 'false'
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine-network

  affine:
    image: *affine-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. AFFINE_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AFFINE_MEMORY_LIMIT:-1g}
          cpus: "${AFFINE_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${AFFINE_MEMORY_RESERVATION:-128m}
          cpus: "${AFFINE_CPU_RESERVATION:-0.25}"
    container_name: affine_server
    volumes:
      - affine-data:/root/.affine/storage
      - affine-config:/root/.affine/config
    environment:
      NODE_ENV: production
      AFFINE_CONFIG_PATH: /root/.affine/config
      DATABASE_URL: postgres://${AFFINE_DB_USER:-affinedbuser}:${AFFINE_DB_PASSWORD}@postgres:5432/${AFFINE_DB_NAME:-affinedb}
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: 6379
      REDIS_SERVER_PASSWORD: ${AFFINE_REDIS_PASSWORD}
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_URL}
      AFFINE_SERVER_HOST: ${AFFINE_HOSTNAME}
      AFFINE_SERVER_HTTPS: 'false'
      MAILER_HOST: ${AFFINE_SMTP_ADDRESS:-smtp.example.com}
      MAILER_PORT: ${AFFINE_SMTP_PORT:-587}
      MAILER_USER: ${AFFINE_SMTP_USER_NAME:-}
      MAILER_PASSWORD: ${AFFINE_SMTP_PASSWORD:-}
      MAILER_SENDER: ${AFFINE_EMAIL_FROM:-affine@example.com}
      TELEMETRY_ENABLE: 'false'
    logging:
      driver: 'json-file'
      options:
        max-size: '1000m'
    networks:
      - affine-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.affine.rule=Host(`${AFFINE_HOSTNAME}`)"
      - "traefik.http.routers.affine.service=affine"
      - "traefik.http.routers.affine.entrypoints=websecure"
      - "traefik.http.services.affine.loadbalancer.server.port=3010"
      - "traefik.http.routers.affine.tls=true"
      - "traefik.http.routers.affine.tls.certresolver=letsencrypt"
      - "traefik.http.services.affine.loadbalancer.passhostheader=true"
      - "traefik.http.routers.affine.middlewares=compresstraefik"
      - "traefik.http.middlewares.compresstraefik.compress=true"
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    container_name: affine_traefik
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--global.checknewversion=true"
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. AFFINE_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AFFINE_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${AFFINE_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${AFFINE_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${AFFINE_BACKUPS_CPU_RESERVATION:-0.1}"
    container_name: affine_backups
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$POSTGRES_BACKUPS_PATH/$$POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$AFFINE_DB_NAME -U $$AFFINE_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" $$DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$POSTGRES_BACKUPS_PATH" -type f -name "$$POSTGRES_BACKUP_NAME-*" -mtime "+$$POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - affine-postgres-backup:/var/lib/postgresql/data
      - affine-data:${DATA_PATH:-/root/.affine/storage}
      - affine-data-backups:${DATA_BACKUPS_PATH:-/srv/affine-application-data/backups}
      - affine-database-backups:${POSTGRES_BACKUPS_PATH:-/srv/affine-postgres/backups}
    environment:
      AFFINE_DB_NAME: ${AFFINE_DB_NAME:-affinedb}
      AFFINE_DB_USER: ${AFFINE_DB_USER:-affinedbuser}
      PGPASSWORD: ${AFFINE_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      POSTGRES_BACKUP_PRUNE_DAYS: ${POSTGRES_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      POSTGRES_BACKUPS_PATH: ${POSTGRES_BACKUPS_PATH:-/srv/affine-postgres/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/affine-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/root/.affine/storage}
      POSTGRES_BACKUP_NAME: ${POSTGRES_BACKUP_NAME:-affine-postgres-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-affine-application-data-backup}
    networks:
      - affine-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
